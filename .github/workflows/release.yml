name: Build and Release

on:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: maneeshchaturvedi/llmlens
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Checkout goreleaser config
        uses: actions/checkout@v4
        with:
          path: _homebrew
          fetch-depth: 0

      - name: Copy goreleaser config into source tree
        run: cp _homebrew/.goreleaser.yaml .goreleaser.yaml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set tag for GoReleaser
        run: |
          git tag ${{ github.event.client_payload.ref }} || true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.client_payload.ref }}
