name: Build and Release

on:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: maneeshchaturvedi/llmlens
          ref: ${{ github.event.client_payload.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 0

      - name: Fetch goreleaser config
        uses: actions/checkout@v4
        with:
          path: _homebrew

      - name: Copy goreleaser config and clean up
        run: |
          cp _homebrew/.goreleaser.yaml .goreleaser.yaml
          rm -rf _homebrew

      - name: Debug workspace
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Top-level files ==="
          ls -la
          echo "=== cmd/ ==="
          ls -la cmd/ 2>/dev/null || echo "cmd/ not found"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.event.client_payload.ref }}
