project_name: lens

builds:
  - main: ./cmd/lens
    binary: lens
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: maneeshchaturvedi
    name: homebrew-lens

brews:
  - repository:
      owner: maneeshchaturvedi
      name: homebrew-lens
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formulae
    homepage: "https://github.com/maneeshchaturvedi/llmlens"
    description: "Stream coding agent sessions to lens-ingest"
    license: "MIT"
    install: |
      bin.install "lens"
    test: |
      system "#{bin}/lens", "--version"

chocolateys:
  - owners: maneeshchaturvedi
    authors: "Maneesh"
    project_url: "https://github.com/maneeshchaturvedi/llmlens"
    license_url: "https://github.com/maneeshchaturvedi/llmlens/blob/main/LICENSE"
    description: "Stream coding agent sessions to lens-ingest"
    tags: "cli llm lens"
    skip_publish: true
